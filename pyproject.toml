[project]
name = "roomdelta"
version = "0.1.0"
description = "What changed in the room? Two phone videos -> shared 3D scene -> moved / added / removed objects with evidence."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
# PyTorch, Depth Anything 3 and LightGlue are not on PyPI in the needed versions; scripts/install.sh installs them.
dependencies = [
  "numpy>=1.26", "scipy>=1.11", "opencv-python-headless>=4.9", "open3d>=0.18", "scikit-learn>=1.3",
  "transformers>=4.57", "accelerate>=1.0", "huggingface_hub>=0.34", "viser>=1.0", "trimesh>=4.0",
  "typer>=0.12", "kornia>=0.7",
]

[project.optional-dependencies]
dev = ["pytest", "pyflakes"]

[project.scripts]
roomdelta = "roomdelta.cli:app"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
